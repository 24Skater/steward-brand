packages:
  - "packages/*"
  - "apps/*"

# Transitive-only security overrides. Duplicated in package.json's `pnpm.overrides`
# on purpose: pnpm 9 (pinned by `packageManager`) reads the package.json field,
# pnpm 10+ reads this file. Keeping both means the audit stays green whichever
# resolver runs. Change them together.
#
# Every entry is range-scoped to a patch inside the same major, so nothing here
# forces a breaking upgrade on a dependent. Drop an entry once the package that
# pulls it in ships a patched version of its own.
overrides:
  brace-expansion: ">=5.0.9"
  "js-yaml@<3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@<3.3.18": "3.3.18"
  "postcss@<=8.5.17": "8.5.18"
  "undici@<7.29.0": "7.29.0"
