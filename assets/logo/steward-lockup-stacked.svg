<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 148" fill="none">
  <title>Steward Stacked Lockup</title>

  <!-- Cross/anchor mark centered -->
  <g transform="translate(28, 0)">
    <rect x="28" y="2" width="8" height="32" rx="4" fill="#E8B847"/>
    <rect x="12" y="14" width="40" height="8" rx="4" fill="#E8B847"/>
    <rect x="30" y="32" width="4" height="40" rx="2" fill="#E8B847"/>
    <rect x="34" y="53" width="13" height="5" rx="2.5" fill="#E8B847"/>
    <rect x="34" y="64" width="9" height="5" rx="2.5" fill="#E8B847"/>
  </g>

  <!-- Wordmark centered below -->
  <text
    x="60"
    y="128"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-size="24"
    font-weight="600"
    fill="#1B2A41"
    letter-spacing="-0.02em"
    text-anchor="middle"
  >Steward</text>
</svg>
