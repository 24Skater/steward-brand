name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          # No registry-url: with it, setup-node writes an .npmrc holding a
          # placeholder token (NODE_AUTH_TOKEN=XXXXX-...), and npm sends that
          # instead of the Trusted Publishing credential. The default registry
          # is npmjs.org anyway.

      # npm Trusted Publishing: the registry trusts this workflow through GitHub's
      # OIDC token (permissions: id-token: write), so no npm token is stored,
      # expires or needs a 2FA bypass. Needs npm 11.5.1+; pnpm publish hands
      # the upload to this npm.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        with:
          script: |
            const published = JSON.parse(process.env.PUBLISHED);
            for (const pkg of published) {
              try {
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: `${pkg.name}@${pkg.version}`,
                  generate_release_notes: true,
                });
              } catch (e) {
                if (e.status !== 422) throw e;
                core.warning(`Release tag ${pkg.name}@${pkg.version} already exists, skipping`);
              }
            }
